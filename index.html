<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Risparmio Facile</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <main class="app">

    <header class="hero">
      <h1>💰 Risparmio Facile</h1>
      <p>Controlla automaticamente le tue spese</p>
    </header>

    <section class="stats">

      <div class="card">
        <span>Entrate</span>
        <strong id="totEntrate">0 €</strong>
      </div>

      <div class="card">
        <span>Uscite</span>
        <strong id="totUscite">0 €</strong>
      </div>

      <div class="card">
        <span>Risparmio</span>
        <strong id="totRisparmio">0 €</strong>
      </div>

      <div class="card">
        <span>Budget Settimanale</span>
        <strong id="budgetSettimanale">0 €</strong>
      </div>

    </section>

    <section class="card">

      <h2>Impostazioni Budget</h2>

      <input type="number" id="stipendio" placeholder="Stipendio mensile">

      <input type="number" id="obiettivo" placeholder="Obiettivo risparmio">

      <button onclick="salvaImpostazioni()">
        Salva
      </button>

    </section>

    <section class="card">

      <h2>Importa Estratto Conto CSV</h2>

      <input type="file" id="csvFile" accept=".csv">

      <button onclick="importaCSV()">
        Importa CSV
      </button>

    </section>

    <section class="card">

      <h2>Aggiungi Movimento</h2>

      <input type="date" id="dataMov">

      <input type="text" id="descrizione" placeholder="Descrizione">

      <input type="number" id="importo" placeholder="Importo">

      <select id="categoria">
        <option>Spesa</option>
        <option>Benzina</option>
        <option>Bollette</option>
        <option>Shopping</option>
        <option>Ristorante</option>
        <option>Abbonamenti</option>
        <option>Entrate</option>
        <option>Altro</option>
      </select>

      <button onclick="aggiungiMovimento()">
        Aggiungi Movimento
      </button>

    </section>

    <section class="card">

      <h2>Grafico Spese</h2>

      <canvas id="graficoCategorie"></canvas>

    </section>

    <section class="card">

      <h2>Movimenti</h2>

      <div id="listaMovimenti"></div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
